<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Народный проект Herbalife Kazakhstan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Montserrat', sans-serif; scroll-behavior: smooth; background: #0a0f1a; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .hl-green { color: #7BC143; }
        .bg-hl-green { background-color: #7BC143; }

        .form-group { position: relative; margin-bottom: 1rem; }
        .input-dark {
            background: rgba(30, 41, 59, 0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 0.8rem 1rem; font-size: 16px; color: white; width: 100%; height: 3.5rem; transition: all 0.25s ease;
        }
        .input-dark:focus { border-color: #7BC143; outline: none; background: rgba(30, 41, 59, 0.8); }

        .checkbox-custom {
            width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
            appearance: none; cursor: pointer; transition: all 0.2s; position: relative; flex-shrink: 0;
        }
        .checkbox-custom:checked { background-color: #7BC143; border-color: #7BC143; }
        .checkbox-custom:checked::after {
            content: '✓'; position: absolute; color: white; font-size: 14px; left: 4px; top: -1px;
        }

        .news-card { background: rgba(255,255,255,0.03); border-radius: 20px; transition: transform 0.3s; overflow: hidden; }

        /* Фикс для мобильного Safari, чтобы не зумил инпуты */
        @media screen and (max-width: 768px) {
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body x-data="{
    lang: 'ru',
    teamSize: 1,
    mobileMenu: false,
    t: {
        ru: {
            hero_title: 'Народный Проект', hero_sub: 'Инициатива Herbalife по поддержке активного образа жизни в Казахстане.',
            btn_join: 'Принять участие', btn_more: 'Узнать больше',
            about_title: 'О проекте', about_text: 'Мы объединяем людей, стремящихся к здоровью и активному долголетию. Наша цель — создать сообщество единомышленников по всей стране.',
            news_title: 'Новости проекта', reg_title: 'Регистрация команды',
            team_name: 'Название команды / семьи', team_size: 'Размер команды',
            m_name: 'ФИО', m_birth: 'Дата рождения', m_phone: 'Телефон',
            emergency_title: 'Экстренный контакт', emergency_name: 'Имя контакта',
            consent_1: 'Согласие на обработку персональных данных', consent_2: 'Согласие на использование медиаматериалов',
            submit: 'Отправить заявку'
        },
        kz: {
            hero_title: 'Халықтық Жоба', hero_sub: 'Herbalife компаниясының Қазақстандағы белсенді өмір салтын қолдау бастамасы.',
            btn_join: 'Қатысу', btn_more: 'Толығырақ',
            about_title: 'Жоба туралы', about_text: 'Біз денсаулық пен белсенді ұзақ өмірге ұмтылатын жандардың басын қосамыз. Мақсатымыз — бүкіл ел бойынша пікірлестер қауымдастығын құру.',
            news_title: 'Жоба жаңалықтары', reg_title: 'Команданы тіркеу',
            team_name: 'Команда / отбасы атауы', team_size: 'Команда құрамы',
            m_name: 'Аты-жөні', m_birth: 'Туған күні', m_phone: 'Телефон',
            emergency_title: 'Шұғыл байланыс', emergency_name: 'Байланыс адамы',
            consent_1: 'Дербес деректерді өңдеуге келісім', consent_2: 'Медиа-материалдарды пайдалануға келісім',
            submit: 'Өтінім беру'
        }
    }
}" x-cloak>

    <nav class="fixed w-full z-50 glass border-b border-white/5 px-4 md:px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-hl-green rounded-full"></div>
                <span class="font-black tracking-tighter uppercase italic text-white text-sm md:text-base">Herbalife <span class="text-slate-400 font-light">KZ</span></span>
            </div>

            <div class="hidden md:flex space-x-8 text-[11px] uppercase font-bold tracking-widest">
                <a href="#about" class="hover:text-hl-green transition" x-text="t[lang].about_title"></a>
                <a href="#news" class="hover:text-hl-green transition" x-text="t[lang].news_title"></a>
                <a href="#register" class="hover:text-hl-green transition" x-text="t[lang].reg_title"></a>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex gap-3 text-xs font-bold border-r border-white/10 pr-4">
                    <button @click="lang = 'ru'" :class="lang === 'ru' ? 'text-hl-green' : 'text-slate-500'">RU</button>
                    <button @click="lang = 'kz'" :class="lang === 'kz' ? 'text-hl-green' : 'text-slate-500'">KZ</button>
                </div>
                <button @click="mobileMenu = !mobileMenu" class="md:hidden text-white">
                    <svg x-show="!mobileMenu" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    <svg x-show="mobileMenu" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <div x-show="mobileMenu" x-transition class="md:hidden pt-4 pb-2 space-y-4 text-center uppercase text-xs font-bold tracking-widest border-t border-white/5 mt-4">
            <a href="#about" @click="mobileMenu = false" class="block py-2" x-text="t[lang].about_title"></a>
            <a href="#news" @click="mobileMenu = false" class="block py-2" x-text="t[lang].news_title"></a>
            <a href="#register" @click="mobileMenu = false" class="block py-2 text-hl-green" x-text="t[lang].reg_title"></a>
        </div>
    </nav>

    <section class="relative min-h-screen flex items-center justify-center text-center px-4 pt-20">
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-gradient-to-b from-[#0a0f1a]/80 via-[#0a0f1a]/60 to-[#0a0f1a]"></div>
            <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&q=80" class="w-full h-full object-cover">
        </div>
        <div class="relative z-10 max-w-4xl">
            <h1 class="text-4xl sm:text-6xl md:text-8xl font-black text-white uppercase mb-6 leading-[0.9] italic" x-text="t[lang].hero_title"></h1>
            <p class="text-sm md:text-xl text-slate-300 mb-8 max-w-2xl mx-auto px-4" x-text="t[lang].hero_sub"></p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="#register" class="w-full sm:w-auto bg-hl-green text-white px-10 py-5 rounded-full font-black uppercase text-xs md:text-sm hover:scale-105 transition shadow-lg shadow-hl-green/20" x-text="t[lang].btn_join"></a>
                <a href="#about" class="w-full sm:w-auto bg-white/10 backdrop-blur text-white px-10 py-5 rounded-full font-black uppercase text-xs md:text-sm hover:bg-white/20 transition" x-text="t[lang].btn_more"></a>
            </div>
        </div>
    </section>

    <section id="about" class="py-16 md:py-24 px-4 md:px-6 bg-[#0f172a]">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-10 md:gap-16 items-center">
            <div class="order-2 md:order-1">
                <h2 class="text-3xl md:text-6xl font-black text-white uppercase mb-6 md:mb-8" x-text="t[lang].about_title"></h2>
                <p class="text-base md:text-lg text-slate-400 leading-relaxed mb-8" x-text="t[lang].about_text"></p>
                <div class="grid grid-cols-2 gap-4 md:gap-6">
                    <div class="p-5 md:p-6 border border-white/5 rounded-2xl bg-white/2">
                        <div class="text-2xl md:text-3xl font-black hl-green mb-1 md:mb-2">100%</div>
                        <div class="text-[10px] uppercase tracking-widest text-slate-500">Натурально</div>
                    </div>
                    <div class="p-5 md:p-6 border border-white/5 rounded-2xl bg-white/2">
                        <div class="text-2xl md:text-3xl font-black hl-green mb-1 md:mb-2">5000+</div>
                        <div class="text-[10px] uppercase tracking-widest text-slate-500">Участников</div>
                    </div>
                </div>
            </div>
            <div class="order-1 md:order-2 rounded-2xl md:rounded-3xl overflow-hidden shadow-2xl h-64 md:h-auto">
                <img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&q=80" class="w-full h-full object-cover">
            </div>
        </div>
    </section>

    <section id="news" class="py-16 md:py-24 px-4 md:px-6">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-black text-white uppercase mb-10 md:mb-12 text-center" x-text="t[lang].news_title"></h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 md:gap-8">
                <template x-for="i in [1,2,3]">
                    <div class="news-card">
                        <div class="h-40 md:h-48 bg-slate-800"></div>
                        <div class="p-6">
                            <div class="text-hl-green text-[10px] font-bold mb-2">12.03.2026</div>
                            <h3 class="text-lg font-bold text-white mb-3">Запуск нового этапа в Алматы</h3>
                            <p class="text-slate-400 text-xs md:text-sm mb-4 leading-relaxed">Узнайте подробности о предстоящем марафоне здоровья в южной столице...</p>
                            <a href="https://herbalifekazakhstan.com" class="text-hl-green text-[10px] font-black uppercase tracking-widest hover:underline">Читать далее →</a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section id="register" class="py-16 md:py-24 px-4 md:px-6 bg-[#0a0f1a]">
        <div class="max-w-4xl mx-auto glass p-6 md:p-16 rounded-[1.5rem] md:rounded-[2.5rem]">
            <h2 class="text-2xl md:text-5xl font-black text-white uppercase mb-10 md:mb-12 text-center" x-text="t[lang].reg_title"></h2>

            <form action="#" method="POST" class="space-y-8 md:space-y-12">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    <div class="form-group">
                        <label class="block text-[9px] md:text-[10px] uppercase font-black text-hl-green mb-2 ml-2" x-text="t[lang].team_name"></label>
                        <input type="text" class="input-dark" placeholder="Gold Team" required>
                    </div>
                    <div class="form-group">
                        <label class="block text-[9px] md:text-[10px] uppercase font-black text-hl-green mb-2 ml-2" x-text="t[lang].team_size"></label>
                        <select x-model="teamSize" class="input-dark bg-[#1e293b]">
                            <option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-6 md:space-y-8">
                    <template x-for="i in parseInt(teamSize)" :key="i">
                        <div class="p-5 md:p-6 border border-white/5 bg-white/2 rounded-xl md:rounded-2xl relative">
                            <div class="absolute -top-2 -left-2 w-6 h-6 md:w-8 md:h-8 bg-hl-green text-white rounded-lg flex items-center justify-center font-black text-[10px] md:text-xs" x-text="i"></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 pt-2">
                                <input type="text" class="input-dark" :placeholder="t[lang].m_name" required>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="date" class="input-dark" required>
                                    <select class="input-dark bg-[#1e293b]">
                                        <option value="m">M</option><option value="f">F</option>
                                    </select>
                                </div>
                                <input type="email" class="input-dark" placeholder="Email" required>
                                <input type="tel" class="input-dark" :placeholder="t[lang].m_phone" required>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="p-5 md:p-6 border-2 border-dashed border-white/10 rounded-xl md:rounded-2xl">
                    <h3 class="text-hl-green font-black uppercase text-[10px] mb-6 tracking-widest" x-text="t[lang].emergency_title"></h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <input type="text" class="input-dark" :placeholder="t[lang].emergency_name" required>
                        <input type="tel" class="input-dark" :placeholder="t[lang].m_phone" required>
                    </div>
                </div>

                <div class="space-y-4 pt-2">
                    <label class="flex items-start gap-4 cursor-pointer">
                        <input type="checkbox" class="checkbox-custom" required>
                        <span class="text-[10px] md:text-xs text-slate-400 leading-tight pt-1" x-text="t[lang].consent_1"></span>
                    </label>
                    <label class="flex items-start gap-4 cursor-pointer">
                        <input type="checkbox" class="checkbox-custom" required>
                        <span class="text-[10px] md:text-xs text-slate-400 leading-tight pt-1" x-text="t[lang].consent_2"></span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-hl-green text-white py-5 md:py-6 rounded-2xl font-black uppercase tracking-widest text-xs md:text-sm hover:brightness-110 transition shadow-xl shadow-hl-green/20" x-text="t[lang].submit"></button>
            </form>
        </div>
    </section>

    <footer class="bg-black py-12 md:py-20 px-6 border-t border-white/5">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8 md:gap-12">
            <div class="text-center md:text-left">
                <div class="text-xl md:text-2xl font-black uppercase italic text-white mb-2">Herbalife <span class="hl-green">PROJECT</span></div>
                <div class="text-[9px] text-slate-600 uppercase tracking-widest">© 2026 Kazakhstan. All rights reserved.</div>
            </div>
            <div class="flex flex-wrap justify-center gap-6 md:gap-8 text-[9px] font-bold uppercase tracking-widest">
                <a href="#" class="text-slate-400 hover:text-hl-green transition">Instagram</a>
                <a href="#" class="text-slate-400 hover:text-hl-green transition">Telegram</a>
                <a href="#" class="text-slate-400 hover:text-hl-green transition">Official Web</a>
            </div>
        </div>
    </footer>

</body>
</html>
